name: Validate
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Transaction and state-machine specifications
        run: dotnet run --project tests/DockingScene.Specs -c Release
      - name: Geometry and persistence specifications
        run: dotnet run --project tests/DockingScene.LayoutSpecs -c Release
      - name: Package UI-independent libraries
        run: |
          mkdir -p artifacts/packages
          for p in src/DockingScene.{Core,Layout,Serialization,Mvvm,Themes}/*.csproj; do
            test -f "$p" || continue
            dotnet pack "$p" -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages-core
          path: artifacts/packages
